# Source: supabase.com/docs/guides/local-development/testing/overview
name: db-tests
on: [push, pull_request]
jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset # apply all migrations fresh
      - run: supabase test db # non-zero exit on any assertion failure
