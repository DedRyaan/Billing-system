# Free-tier keep-alive (D-39 / RESEARCH Pattern 8 / PITFALLS.md Pitfall 6).
#
# Supabase pauses FREE-tier projects after ~7 days of inactivity. This workflow
# pings public.health_check() once per day through PostgREST; the SECURITY
# DEFINER RPC counts as database activity and returns the constant text "ok"
# without touching tenant rows, so anon-key calls never trip RLS 401s.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL      - Project Settings → API → Project URL
#   SUPABASE_ANON_KEY - Project Settings → API → anon public key
#
# Alerting: GitHub's default "workflow failed" email notification to
# watchers/author covers the red-run alert requirement — no extra integration
# needed while the repo has few collaborators.
# (Commit re-pushed post-registration-miss: GitHub indexed only db-tests.yml
# from the repo's first-ever push; this line forces re-registration.)
name: keep-alive

on:
  schedule:
    # Daily at an odd minute (03:17 UTC = 08:47 IST). Odd minute avoids the
    # top-of-hour scheduling thundering herd on shared runners.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health_check() RPC (counts as DB activity)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # Fail loudly on misconfiguration instead of silently "succeeding".
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL secret is not set (Project Settings -> API -> Project URL)"
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set (Project Settings -> API -> anon public key)"
            exit 1
          fi

          # curl -f fails loudly on ANY HTTP error class including 401 —
          # a silent 401 "success" is exactly Pitfall 6.
          body="$(curl -fsS -X POST "${SUPABASE_URL}/rest/v1/rpc/health_check" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json")"

          echo "health_check response: ${body}"
          # PostgREST wraps scalar RPC results in JSON quotes.
          if [ "${body}" != '"ok"' ]; then
            echo "::error::health_check returned unexpected body: ${body}"
            exit 1
          fi

          echo "Keep-alive ping OK — project active."
