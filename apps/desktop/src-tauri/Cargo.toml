# Billing desktop - Tauri 2 shell.
#
# NOTE (honest toolchain gap): this crate is AUTHORED here but NOT compiled -
# the executor machine has no Rust toolchain. Crate resolution/build belongs
# to end-of-phase human verification on a Rust-capable host (`pnpm tauri dev`).

[package]
name = "billing-desktop"
version = "0.4.2"
edition = "2021"
description = "Settle - GST billing desktop shell (Tauri 2)"

[lib]
name = "billing_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
# generate_context! emits serde_json values for the plugins block in
# tauri.conf.json (deep-link schemes); the crate must be a direct dependency.
serde_json = "1"
# Window geometry persistence (D-66/A12).
tauri-plugin-window-state = "2"
# File-backed session storage seam (D-70/AUTH-01).
tauri-plugin-store = "2"
# Single instance guard (A12): second launch focuses the existing window.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# settle:// scheme for email sign-in and password-reset links.
tauri-plugin-deep-link = "2"
